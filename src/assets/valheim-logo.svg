<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" fill="none">
  <!-- Viking Rune Emblem / Norse Raven & Compass Glyph -->
  <g transform="translate(10, 8)">
    <circle cx="32" cy="32" r="28" stroke="#38BDF8" stroke-width="2" opacity="0.6" stroke-dasharray="4 2" />
    <circle cx="32" cy="32" r="23" fill="#0A0E17" stroke="#38BDF8" stroke-width="1.5" />
    <!-- Runes inside circle -->
    <path d="M 32,15 L 32,49 M 23,24 L 41,40 M 41,24 L 23,40" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="32" cy="32" r="3.5" fill="#FFFFFF" />
  </g>
  <!-- Stylized Norse Carved Lettering -->
  <g fill="#FFFFFF" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-weight="900" font-size="40" letter-spacing="4">
    <text x="82" y="52">VALHEIM</text>
  </g>
  <text x="84" y="66" fill="#38BDF8" font-family="monospace" font-size="9" font-weight="bold" letter-spacing="3.5">VIKING SURVIVAL DEDICATED</text>
</svg>
