    <circle cx="30" cy="30" r="7" fill="#0C0E14" />
    <path d="M 30,30 L 22,7 A 23,23 0 0,1 38,7 Z" fill="#0C0E14" />
    <path d="M 30,30 L 10,41 A 23,23 0 0,1 18,55 Z" fill="#0C0E14" />
